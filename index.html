<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SimpelJak Natuna App</title>

  <!-- PWA -->
  <link rel="manifest" href="/simpeljak/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="/simpeljak/icon-192.png">
  <link rel="apple-touch-icon" href="/simpeljak/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
    .full-screen-iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <iframe
    src="https://script.google.com/macros/s/AKfycbzkKHkB-OfKyWMlibbVbzjizTtibKymLg1oLu6O8uvK7rPpcQRG6ltWq0ky7akjoINb/exec"
    class="full-screen-iframe"
    allow="geolocation; microphone; camera">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/simpeljak/sw.js', { scope: '/simpeljak/' });
      });
    }
  </script>
</body>
</html>
